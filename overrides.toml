# Hand-written codegen overrides for Dishonored (Xbox 360, Europe, title 425307E3). Each entry needs evidence.

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). Found by shape (2026-10-28), the same
# library code sa2-nx describes; memcpy/memmove/memset of this image also match sa2-nx's CRT signatures
# (tools/crt_signatures.py scan: unique matches at 0x82CD1D20 / 0x82CCD080 / 0x82CD2250), so it is the same Xbox 360
# SDK CRT. With the addresses the generator emits host setjmp/longjmp keyed by the guest jmp_buf.
#   setjmp  0x82CD4980: 179 words, 64 VMX128 stores, std r13-r31 + stfd f14-f31 into (r3), mflr; ends li r3,0 / blr;
#           3 bl callers (0x82CA2308, 0x82CA30BC, 0x82CB755C)
#   longjmp 0x82CD4360: 187 words, the mirror image (64 VMX128 loads, ld r13-r31, lfd f14-f31, mtlr);
#           3 bl callers (0x82CA0538, 0x82CB4338, 0x82CB439C) and one tail branch (0x82CA0614)
setjmp_address = 0x82CD4980
longjmp_address = 0x82CD4360

# dishonored-nx (2026-11-11, pure-nx's overrides.toml of 2026-11-07/08, the user's request): the optimised codegen of
# renut-nx / sa2-nx, for tools\rexglue-sdk-dishonored's generator (codegen.cmd; build_switch_turbo.cmd runs the whole
# round). Only the shape of the C++ changes, so the compiler keeps guest state in host registers; each option is
# unit-tested exact by sa2-nx / banjo-nx, none game-specific (renut-nx app/renut_config.toml and
# docs/codegen-enhancements.md have the measurements):
#   - cr0-cr7, ctr, xer and the lwarx reservation as C++ locals;
#   - skip_msr: no mfmsr/mtmsrd fences, ctx.msr stores or global lock around guest atomic sequences (a stwcx. is
#     already a compare-and-swap);
#   - dform_disp_split: D-form loads/stores as base + zext(reg) + disp (differs only when reg + disp crosses 2^32, a
#     guest fault either way);
#   - fctiwz_inline, fcti_inline: the float-to-integer conversions inline, rounding halves to even as the Xbox 360;
#   - fp_moves_modeless: a float load, store or move does not switch the FPU between IEEE and VMX flush mode;
#   - dcbt_prefetch: dcbt / dcbtst as the host's prefetch of the same address (never faults, changes no value);
#   - rotate_word_shifts: rlwinm / rlwimi whose mask does not wrap as one shift / extract;
#   - fp_compares_modeless, fp_mode_lookahead (+ _past_branch), fp_copy_pairs, fp_copy_forwarding: fewer flush-mode
#     switches (renut-nx: -38 %, each one an msr fpcr);
#   - div_inline: divw / divwu / divd / divdu through rex::ppc helpers.
# After every codegen.cmd: python tools\post_codegen_dishonored.py (the generator writes the plain text back).
# Back to the plain codegen: delete these lines (and the two managed blocks below) and run codegen.cmd.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
fp_moves_modeless = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
# "The diet" (nfsmw-nx docs/toolchain.md, renut-nx app/renut_config.toml): r14-r31, f14-f31, v14-v31 / v64-v127 as C++
# locals instead of ctx, so every function's __savegprlr_N / __restgprlr_N calls go away (nfsmw-nx about 14 % of its
# main thread, renut-nx -4.5 % instructions and -11 % stores). Exact once every split piece that reads a register its
# parent set is marked share_registers (tools\diet_marks_dishonored.py, in build_switch_turbo.cmd). The one Renut hook
# that read a caller's r31 (IsFencePending's occlusion batch, src/renut_engine/gpu/d3d/hooks/device.cpp) finds the
# batch by its fence now (occlusion.cpp BatchPending). The CRT setjmp / longjmp above are host setjmp / longjmp.
non_volatile_as_local = true
# No `ctx.lr = <return address>;` before every call (renut-nx's diet half; masseffect-nx -10 % on its main thread for
# both). Only diagnostics read ctx.lr here (src/d3d_probe.cpp, not built); the generator keeps the store where the LR
# is read as data.
elide_lr_stores = true

